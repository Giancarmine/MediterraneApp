## default connection pool
spring:
  datasource:
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5

    ## PostgreSQL: no credentials are committed. Provide the connection through
    ## SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and
    ## SPRING_DATASOURCE_PASSWORD (or a local, untracked profile).

  # Hibernate ddl auto (create, create-drop, validate, update)
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialec

  # Keep the historical error payload (Boot 2.2 included the exception message).
  # Boot 4 moved the MVC error attributes under spring.web.error.
  web:
    error:
      include-message: always
